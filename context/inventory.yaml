# OpsWatch inventory: the only runtime source of hosts, addresses, users, keys and URLs.
# Every host gets all five checks. HTTP and cert are "Not applicable" when a host has no URLs.
defaults:
  ssh_user: opswatch
  ssh_key: ~/.ssh/opswatch

hosts:
  web01:
    address: 10.10.1.11
    role: web
    services: [nginx]
    urls:
      - https://web01/          # web01 must resolve via /etc/hosts on ops-ctl
    ca_cert: /etc/opswatch/web01.crt   # installed on ops-ctl by lab/ansible/site.yml

  app01:
    address: 10.10.1.12
    role: app
    services: [opswatch-demo]

  stor01:
    address: 10.10.1.13
    role: storage
