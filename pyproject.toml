[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "opswatch"
version = "0.1.0"
description = "Agentless Linux health and incident console"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
web = ["fastapi==0.115.6", "jinja2==3.1.4", "uvicorn==0.32.1"]
dev = ["pytest", "ruff", "httpx==0.28.1"]

[tool.setuptools]
packages = ["opswatch"]

[tool.setuptools.package-data]
opswatch = ["templates/*.html"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
